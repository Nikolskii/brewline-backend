# Проверки на pull request и на push в main.
#
# Это единственный настоящий гейт репозитория: локальный pre-commit обходится
# флагом --no-verify, а сюда попадает всё. Merge в main разрешён только при
# зелёном прогоне (настройка branch protection на стороне GitHub).
#
# Ключевой шаг — check:spec. Контракт генерируется из zod-схем (ADR 0010),
# а openapi.yaml коммитится в репозиторий. Значит появляется риск: поменял схему,
# забыл перегенерировать — и в git лежит устаревшая спека, из которой соберётся
# неверный пакет типов. Шаг заново генерирует спеку и падает, если результат
# отличается от закоммиченного. Дисциплина заменена проверкой.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Форматирование
        # Страховка от коммита в обход pre-commit-хука.
        run: npm run format:check

      - name: Линт
        run: npm run lint

      - name: Сборка
        # tsc по src/ — типы приложения не проверял никто: vitest работает с уже
        # стёртым TypeScript, а build:types собирает только пакет типов. Без этого
        # шага ошибка типов в исходниках всплывала бы при сборке Docker-образа.
        run: npm run build

      - name: Тесты
        run: npm test

      - name: Типы вспомогательных скриптов
        # scripts/ не входит в сборку приложения, поэтому проверяется отдельным
        # конфигом — иначе ошибка в генераторе спеки всплыла бы только при запуске.
        run: npm run typecheck:scripts

      - name: Спека соответствует zod-схемам
        run: npm run check:spec

      - name: Пакет типов собирается
        run: npm run build:types
